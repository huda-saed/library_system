{% extends "base.html" %}
{% block title %}{{ action }} — Library System{% endblock %}
{% block content %}
<div class="container section-pad">
  <span class="section-eyebrow">Maamulka Nidaamka</span>
  <h1>{{ action }}</h1>
  <div class="divider-brass"></div>
  <div class="card-plain" style="max-width: 560px;">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-ink">Kaydi</button>
      <a href="{% url 'core:library_list' %}" class="btn btn-outline-ink">Jooji</a>
    </form>
  </div>
</div>
{% endblock %}
