{% extends "base.html" %}
{% block title %}Tirtir Library — Library System{% endblock %}
{% block content %}
<div class="container section-pad">
  <div class="card-plain" style="max-width: 560px;">
    <h3>Ma hubtaa inaad tirtirto?</h3>
    <p class="text-muted">Waxaad tirtirayaa library-ga <strong>{{ library.name }}</strong>. Haddii uu leeyahay buugaag ama isticmaalayaal, lama tirtiri doono.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-danger">Haa, Tirtir</button>
      <a href="{% url 'core:library_list' %}" class="btn btn-outline-ink">Jooji</a>
    </form>
  </div>
</div>
{% endblock %}
