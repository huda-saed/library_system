{% extends "base.html" %}
{% block title %}{{ action }} — Library System{% endblock %}
{% block content %}
<div class="container section-pad">
  <span class="section-eyebrow">Maamulka Buugaagta</span>
  <h1>{{ action }}</h1>
  <div class="divider-brass"></div>

  <div class="card-plain" style="max-width: 720px;">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row">
        {% for field in form %}
        <div class="col-md-6 mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-ink mt-2">Kaydi Buugga</button>
      <a href="{% url 'catalog:book_list' %}" class="btn btn-outline-ink mt-2">Jooji</a>
    </form>
  </div>
</div>
{% endblock %}
